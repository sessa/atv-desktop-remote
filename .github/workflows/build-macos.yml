name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build and upload macOS artifact
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      npm_config_legacy_peer_deps: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Cache Electron build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install app dependencies
        run: npm ci --prefix app --legacy-peer-deps

      - name: Build arm64 macOS DMG (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npx electron-builder --mac dmg --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Verify ad-hoc signing on built app
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/ATV Remote.app"
          codesign -dv --verbose=4 "dist/mac-arm64/ATV Remote.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atv-remote-macos-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*arm64*.dmg
